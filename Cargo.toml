[package]
name = "validate-commits"
version = "0.1.0"
edition = "2024"
description = "Run Nix flake checks for every commit in a revision range"
license = "MIT"
repository = "https://github.com/fungi-protocol/validate-commits"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["blob-diff", "revision", "sha1"] }
serde_json = "1"
tempfile = "3.23.0"
thiserror = "2"
